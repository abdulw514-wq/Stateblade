<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0B0E14"/>

  <!-- Grid texture -->
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#232B40" stroke-width="0.5" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glow -->
  <ellipse cx="280" cy="315" rx="240" ry="220" fill="#F2B705" opacity="0.05"/>
  <ellipse cx="280" cy="315" rx="140" ry="140" fill="#3FC1C9" opacity="0.04"/>

  <!-- Signal bars (bottom-aligned at y=480) -->
  <rect x="110" y="390" width="58" height="90"  rx="6" fill="#3FC1C9" opacity="0.45"/>
  <rect x="182" y="330" width="58" height="150" rx="6" fill="#3FC1C9" opacity="0.65"/>
  <rect x="254" y="255" width="58" height="225" rx="6" fill="#F2B705" opacity="0.85"/>
  <rect x="326" y="170" width="58" height="310" rx="6" fill="#F2B705"/>

  <!-- Blade diagonal line -->
  <line x1="100" y1="475" x2="394" y2="178" stroke="#E8EBF2" stroke-width="2.5" stroke-linecap="round" opacity="0.12"/>

  <!-- Vertical divider -->
  <line x1="450" y1="160" x2="450" y2="470" stroke="#232B40" stroke-width="1"/>

  <!-- Eyebrow -->
  <text x="500" y="225" font-family="Inter, sans-serif" font-size="22" font-weight="500" fill="#3FC1C9" letter-spacing="5">CHANNEL INTELLIGENCE</text>

  <!-- Wordmark -->
  <text x="496" y="360" font-family="'Space Grotesk', sans-serif" font-size="110" font-weight="700" fill="#E8EBF2" letter-spacing="-4">State</text>
  <text x="758" y="360" font-family="'Space Grotesk', sans-serif" font-size="110" font-weight="700" fill="#F2B705" letter-spacing="-4">Blade</text>

  <!-- Tagline -->
  <text x="500" y="415" font-family="Inter, sans-serif" font-size="28" font-weight="400" fill="#7C8598">See who's winning any niche — ranked by real data.</text>

  <!-- URL pill background -->
  <rect x="498" y="442" width="272" height="44" rx="22" fill="#131826" stroke="#232B40" stroke-width="1"/>
  <!-- Dot -->
  <circle cx="526" cy="464" r="7" fill="#F2B705"/>
  <!-- URL text -->
  <text x="544" y="469" font-family="'JetBrains Mono', monospace" font-size="20" fill="#7C8598" letter-spacing="0.5">stateblade.com</text>
</svg>
